[popup]
; Number of suggestions shown at once (1-12).
max_results=7

[matching]
; Show suggestions after this many characters following the colon.
minimum_characters=1

[disabled_apps]
; Comma-separated executable names. The tray menu can update this automatically.
; Example: process_names=Code.exe,WindowsTerminal.exe
process_names=

[positioning]
; Custom editors that report stale accessibility caret coordinates.
; These apps use a stable anchor immediately above their bottom composer.
bottom_anchor_apps=
